<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LexiPath Corrected Brand Assets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1A2433;
    --sage: #7B8F7A;
    --mist: #D6D4CC;
    --offwhite: #F7F5EF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px;
    background: var(--offwhite);
    color: var(--ink);
    font-family: Lexend, Arial, sans-serif;
  }
  h1 { font-weight: 500; }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 24px;
  }
  .card {
    background: white;
    border: 1px solid var(--mist);
    border-radius: 20px;
    padding: 28px;
    min-height: 260px;
  }
  img { display: block; max-width: 100%; max-height: 220px; margin: auto; }
  .small img { width: 64px; }
  .swatches { display: flex; gap: 14px; flex-wrap: wrap; }
  .swatch {
    width: 150px;
    height: 100px;
    border-radius: 16px;
    padding: 12px;
    display: flex;
    align-items: flex-end;
    border: 1px solid var(--mist);
  }
</style>
</head>
<body>
  <h1>LexiPath — Corrected Concept 02</h1>
  <div class="grid">
    <section class="card"><h2>Primary lockup</h2><img src="lexipath-horizontal.svg"></section>
    <section class="card"><h2>Standalone mark</h2><img src="lexipath-mark.svg"></section>
    <section class="card"><h2>Stacked lockup</h2><img src="lexipath-stacked.svg"></section>
    <section class="card"><h2>App icon</h2><img src="lexipath-app-icon.svg"></section>
    <section class="card"><h2>Monochrome</h2><img src="lexipath-horizontal-monochrome.svg"></section>
    <section class="card small"><h2>Favicon</h2><img src="favicon.svg"></section>
  </div>
  <h2>Palette</h2>
  <div class="swatches">
    <div class="swatch" style="background:#1A2433;color:white">#1A2433</div>
    <div class="swatch" style="background:#7B8F7A;color:white">#7B8F7A</div>
    <div class="swatch" style="background:#D6D4CC">#D6D4CC</div>
    <div class="swatch" style="background:#F7F5EF">#F7F5EF</div>
  </div>
</body>
</html>
