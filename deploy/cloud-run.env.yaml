# Public runtime settings only. Secrets are supplied separately by Secret Manager.
# CLIENT_URL is set to the deployed service URL by deploy-gcp.ps1.
NODE_ENV: "production"
JWT_EXPIRES_IN: "24h"
USE_MOCK_AI: "false"
GEMINI_MODEL_NAME: "gemini-3.1-flash-lite"
GEMINI_TIMEOUT_MS: "90000"
GEMINI_MAX_RETRIES: "2"
ERROR_CONFIDENCE_THRESHOLD: "0.6"
RECOMMENDATION_USE_MOCKS: "true"
