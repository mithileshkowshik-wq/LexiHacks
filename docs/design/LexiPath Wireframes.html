document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin */\n@font-face {\n  font-family: 'Gochi Hand';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"8584a8ae-1d27-424a-bfc0-2dab820027aa\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle><style>body{margin:0;background:#f0eee9;font-family:'Atkinson Hyperlegible',system-ui,sans-serif}a{color:#1a1a1a}a:hover{color:#444}.dv-turn{padding:40px 44px 32px;border-bottom:1px solid rgba(0,0,0,.08);scroll-margin-top:16px}.dv-thd{display:flex;align-items:baseline;gap:10px;margin:0 0 20px}.dv-tid{font:600 10px ui-monospace,Menlo,monospace;padding:3px 7px;background:#1a1a1a;color:#fff;border-radius:4px;text-decoration:none}.dv-tname{font:600 13px/1.2 system-ui,sans-serif;color:#1a1a1a}.dv-opts{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}.dv-opt{flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px}.dv-oid{font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a1a;border-radius:5px;text-decoration:none}.dv-olabel{display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 system-ui,sans-serif;color:rgba(0,0,0,.55)}.dv-card{max-width:100%;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}.dv-opt:target .dv-oid{background:#2a78d6;color:#fff}.dv-next{margin:22px 0 0;font:12px/1.5 system-ui,sans-serif;color:rgba(0,0,0,.5)}<\u002Fstyle><\u002Fhelmet>\n\n<section class=\"dv-turn\" id=\"t6\" data-screen-label=\"Turn 6 — Consistency + accessibility pass\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t6\">6<\u002Fa><span class=\"dv-tname\">Consistency + accessibility pass — fixes applied in place to turns 1–5<\u002Fspan><\u002Fdiv>\n<div class=\"dv-opts\">\n\n<!-- ============ 6a: Reading comfort toggle ============ -->\n<div class=\"dv-opt\" id=\"6a\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#6a\">6a<\u002Fa>Reading comfort toggle — added to the shell sidebar (see <a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa>/<a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa>), applies to every screen<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:760px\">\n<div style=\"padding:24px;display:flex;flex-direction:column;gap:20px\">\n\n  <!-- The control itself -->\n  <div style=\"display:flex;align-items:center;gap:14px;border:1.5px solid #999;border-radius:10px;padding:12px 16px;background:#fff;align-self:flex-start\">\n    <div style=\"font-size:15px;font-weight:700\">Aa Reading comfort<\u002Fdiv>\n    <div style=\"width:52px;height:30px;border:2px solid #1a1a1a;border-radius:17px;position:relative;flex:none;cursor:pointer\"><div style=\"position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#1a1a1a\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"font-size:13px;color:#777\">shown ON<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- The two modes -->\n  <div style=\"display:flex;gap:16px;flex-wrap:wrap\">\n    <div style=\"flex:1;min-width:300px;border:1.5px solid #999;border-radius:12px;overflow:hidden\">\n      <div style=\"padding:8px 14px;border-bottom:1.5px dashed #bbb;font:600 11px ui-monospace,monospace;color:#777\">OFF — STANDARD<\u002Fdiv>\n      <div style=\"padding:18px 18px;background:#fff\">\n        <div style=\"font-size:15px;font-weight:700;margin-bottom:8px\">Sample card text<\u002Fdiv>\n        <div style=\"font-size:14.5px;line-height:1.6;color:#444;max-width:52ch\">Neutral white background. Line height 1.6, normal paragraph spacing — the layouts you see in turns 1–5.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-width:300px;border:2px solid #1a1a1a;border-radius:12px;overflow:hidden\">\n      <div style=\"padding:8px 14px;border-bottom:1.5px dashed #bbb;font:600 11px ui-monospace,monospace;color:#777;background:#f6efe3\">ON — COMFORT<\u002Fdiv>\n      <div style=\"padding:24px 20px;background:#f6efe3\">\n        <div style=\"font-size:15px;font-weight:700;margin-bottom:12px\">Sample card text<\u002Fdiv>\n        <div style=\"font-size:14.5px;line-height:2;letter-spacing:.01em;color:#3d3a34;max-width:48ch\">Warmer paper tint instead of white. Line height goes to 2, paragraph and card spacing increase, text measure narrows. Everything else stays put — no reflowing of the layout.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:12.5px;color:#777;line-height:1.6\">The toggle sits in the shell sidebar so it is reachable from any screen; the setting persists per teacher.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ 6b: Changelog ============ -->\n<div class=\"dv-opt\" id=\"6b\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#6b\">6b<\u002Fa>What changed in turns 1–5<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:560px\">\n<div style=\"padding:24px 28px;display:flex;flex-direction:column;gap:14px\">\n  <div style=\"font-family:'Gochi Hand',cursive;font-size:20px\">Consistency<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14.5px;line-height:1.7;color:#444\">\n    <div style=\"display:flex;gap:10px\"><div style=\"flex:none;font-weight:700\">✔<\u002Fdiv><div>Detail-screen titles (<a class=\"dv-oid\" href=\"#3a\">3a<\u002Fa>, <a class=\"dv-oid\" href=\"#3c\">3c<\u002Fa>) resized to match <a class=\"dv-oid\" href=\"#4a\">4a<\u002Fa>/<a class=\"dv-oid\" href=\"#5a\">5a<\u002Fa> — all top bars now: back button · title 22px · subline 13px.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:10px\"><div style=\"flex:none;font-weight:700\">✔<\u002Fdiv><div>One category-chip spec everywhere (symbol + full label, 16px radius, same padding/size) — was 4 slightly different chips across <a class=\"dv-oid\" href=\"#3a\">3a<\u002Fa>, <a class=\"dv-oid\" href=\"#5a\">5a<\u002Fa>, <a class=\"dv-oid\" href=\"#5b\">5b<\u002Fa>.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:10px\"><div style=\"flex:none;font-weight:700\">✔<\u002Fdiv><div>Button hierarchy confirmed: solid black = primary (one per screen), white 2px outline = secondary, grey 1.5px outline = tertiary.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1.5px dashed #bbb;margin:4px 0\"><\u002Fdiv>\n  <div style=\"font-family:'Gochi Hand',cursive;font-size:20px\">Accessibility<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14.5px;line-height:1.7;color:#444\">\n    <div style=\"display:flex;gap:10px\"><div style=\"flex:none;font-weight:700\">✔<\u002Fdiv><div>All interactive targets now ≥44px: card actions in <a class=\"dv-oid\" href=\"#3a\">3a<\u002Fa>, category-count chips, sample-include chips in <a class=\"dv-oid\" href=\"#4a\">4a<\u002Fa>, banner buttons and the banner's ✕.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:10px\"><div style=\"flex:none;font-weight:700\">✔<\u002Fdiv><div>Scan outline markers in <a class=\"dv-oid\" href=\"#3a\">3a<\u002Fa> gained text labels (◆ Phon, ● Orth…) — no icon-only category cues left.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:10px\"><div style=\"flex:none;font-weight:700\">✔<\u002Fdiv><div>Removed the one italic (teacher note in <a class=\"dv-oid\" href=\"#3a\">3a<\u002Fa>) — emphasis by weight only.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:10px\"><div style=\"flex:none;font-weight:700\">✔<\u002Fdiv><div>Rationale paragraphs in <a class=\"dv-oid\" href=\"#5a\">5a<\u002Fa> capped at ~62ch measure; line height ≥1.6 everywhere.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:10px\"><div style=\"flex:none;font-weight:700\">✔<\u002Fdiv><div>Reading comfort toggle added to the shell — see <a class=\"dv-oid\" href=\"#6a\">6a<\u002Fa>.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p class=\"dv-next\">Try next: \"show a screen in comfort mode end-to-end\" · \"ready for the styled version\" · \"anything still inconsistent? point it out\"<\u002Fp>\n<\u002Fsection>\n\n<section class=\"dv-turn\" id=\"t5\" data-screen-label=\"Turn 5 — Intervention Recommendations\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t5\">5<\u002Fa><span class=\"dv-tname\">Intervention Recommendations (opened from \"View recommendations\" in <a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa>)<\u002Fspan><\u002Fdiv>\n<div class=\"dv-opts\">\n\n<!-- ============ 5a: Current set + outdated banner ============ -->\n<div class=\"dv-opt\" id=\"5a\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#5a\">5a<\u002Fa>Current set — outdated banner citing what changed<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:920px\">\n<div style=\"display:flex;flex-direction:column;min-height:700px\">\n\n  <!-- Top bar -->\n  <div style=\"display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:2px solid #1a1a1a;flex-wrap:wrap\">\n    <div style=\"display:flex;align-items:center;gap:8px;padding:10px 16px;border:2px solid #1a1a1a;border-radius:10px;font-family:'Gochi Hand',cursive;font-size:16px;min-height:44px;box-sizing:border-box;cursor:pointer\">← Wei Jie Lim<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:2px\">\n      <div style=\"font-family:'Gochi Hand',cursive;font-size:22px\">Intervention recommendations<\u002Fdiv>\n      <div style=\"font-size:13px;color:#666\">Generated 28 Jun 2026 · from 5 analysed samples · status: <b>needs refresh<\u002Fb><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Outdated banner -->\n  <div style=\"display:flex;align-items:center;gap:14px;margin:20px 24px 0;border:2.5px solid #1a1a1a;border-radius:12px;padding:16px 18px;background:repeating-linear-gradient(45deg,#fff,#fff 10px,#f0efe9 10px,#f0efe9 20px);flex-wrap:wrap\">\n    <div style=\"width:38px;height:38px;flex:none;border:2px solid #1a1a1a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700\">!<\u002Fdiv>\n    <div style=\"flex:1;min-width:240px;display:flex;flex-direction:column;gap:3px\">\n      <div style=\"font-size:16px;font-weight:700\">These recommendations may be outdated<\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.6;color:#444\">Since they were generated: <b>3 error tags corrected<\u002Fb> and <b>1 new sample analysed<\u002Fb> (12 Jul).<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px\">\n      <div style=\"display:flex;align-items:center;padding:12px 18px;border:1.5px solid #999;border-radius:10px;background:#fff;font-size:15px;min-height:48px;box-sizing:border-box;cursor:pointer\">Keep current set<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;padding:12px 20px;border:2.5px solid #1a1a1a;border-radius:10px;background:#1a1a1a;color:#fff;font-family:'Gochi Hand',cursive;font-size:17px;min-height:48px;box-sizing:border-box;cursor:pointer\">↻ Regenerate<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Strategy cards -->\n  <div style=\"flex:1;padding:22px 24px;display:flex;flex-direction:column;gap:16px\">\n\n    <div style=\"border:2px solid #1a1a1a;border-radius:12px;background:#fff;overflow:hidden\">\n      <div style=\"display:flex;align-items:flex-start;gap:14px;padding:16px 20px\">\n        <div style=\"width:34px;height:34px;flex:none;border:2px solid #1a1a1a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Gochi Hand',cursive;font-size:17px\">1<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;flex:1\">\n          <div style=\"font-family:'Gochi Hand',cursive;font-size:20px;line-height:1.35\">Daily phoneme–grapheme mapping drills (10 min)<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <div style=\"display:flex;align-items:center;gap:6px;border:1.5px solid #1a1a1a;border-radius:16px;padding:6px 12px;font-size:13.5px;background:#e8e8e4\">targets ◆ Phonological<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1.5px dashed #bbb;padding:14px 20px 16px;background:#fafaf8;display:flex;gap:12px\">\n        <div style=\"font:600 11px ui-monospace,monospace;color:#777;flex:none;padding-top:3px\">WHY<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.75;color:#444;max-width:62ch\">Phonological errors are Wei Jie's most frequent category (21 of 47) and appear in every sample — e.g. \"becos\", \"swiming pol\". Consistent sound-to-letter mapping practice addresses the root pattern rather than individual words.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:2px solid #1a1a1a;border-radius:12px;background:#fff;overflow:hidden\">\n      <div style=\"display:flex;align-items:flex-start;gap:14px;padding:16px 20px\">\n        <div style=\"width:34px;height:34px;flex:none;border:2px solid #1a1a1a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Gochi Hand',cursive;font-size:17px\">2<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;flex:1\">\n          <div style=\"font-family:'Gochi Hand',cursive;font-size:20px;line-height:1.35\">Word-family sorting with common orthographic patterns<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <div style=\"display:flex;align-items:center;gap:6px;border:1.5px solid #1a1a1a;border-radius:16px;padding:6px 12px;font-size:13.5px;background:#e8e8e4\">targets ● Orthographic<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1.5px dashed #bbb;padding:14px 20px 16px;background:#fafaf8;display:flex;gap:12px\">\n        <div style=\"font:600 11px ui-monospace,monospace;color:#777;flex:none;padding-top:3px\">WHY<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.75;color:#444;max-width:62ch\">Orthographic errors cluster around vowel digraphs (\"ea\", \"oo\"). Sorting word families makes the visual patterns explicit and builds recognition without rote spelling lists.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:2px solid #1a1a1a;border-radius:12px;background:#fff;overflow:hidden\">\n      <div style=\"display:flex;align-items:flex-start;gap:14px;padding:16px 20px\">\n        <div style=\"width:34px;height:34px;flex:none;border:2px solid #1a1a1a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Gochi Hand',cursive;font-size:17px\">3<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;flex:1\">\n          <div style=\"font-family:'Gochi Hand',cursive;font-size:20px;line-height:1.35\">Sentence-boundary practice with read-aloud punctuation checks<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <div style=\"display:flex;align-items:center;gap:6px;border:1.5px solid #1a1a1a;border-radius:16px;padding:6px 12px;font-size:13.5px;background:#e8e8e4\">targets ✚ Punctuation<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px;border:1.5px solid #1a1a1a;border-radius:16px;padding:6px 12px;font-size:13.5px;background:#e8e8e4\">targets ■ Capitalisation<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1.5px dashed #bbb;padding:14px 20px 16px;background:#fafaf8;display:flex;gap:12px\">\n        <div style=\"font:600 11px ui-monospace,monospace;color:#777;flex:none;padding-top:3px\">WHY<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.75;color:#444;max-width:62ch\">Punctuation and capitalisation errors co-occur at sentence boundaries in the last three samples — treating them together as \"sentence starts/ends\" is more effective than separate drills.<\u002Fdiv>\n      <\u002Fdiv>\n
